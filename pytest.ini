[pytest]
testpaths = tests
addopts = -v --tb=short
markers =
    api: FastAPI backend & API contract tests
    functional: End-to-end UI functional tests in Chrome
    i18n: Localization (zh-Hant) and multi-locale resilience tests
    en_i18n: English (en) translation and language-switching tests
    responsive: Desktop and mobile viewport layout tests
    math: Recommendation reward math and combo optimization verification
    data_quality: Card rule sanity checks for scraper parsing artifacts
    pending_app_push: Tests for new UI features awaiting push to credit_card_recommend main
    official_sync: Cross-check displayed card rates against live official bank websites

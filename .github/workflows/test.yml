name: E2E & i18n Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily 09:00 Asia/Taipei (01:00 UTC) official bank rate & URL sync monitoring
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional external URL (leave empty to boot credit_card_recommend locally in CI)"
        required: false
        default: ""
      require_en:
        description: "Fail if English (en) i18n is not active"
        type: boolean
        required: false
        default: false
      run_full_suite:
        description: "Run the entire test suite (all 46 tests including responsive, data_quality & official_sync)"
        type: boolean
        required: false
        default: true

# Least-privilege default; only the separate deploy-pages job requests contents: write
permissions:
  contents: read

jobs:
  pytest-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout test suite (credit_card_test)
        uses: actions/checkout@v4
        with:
          path: test-suite

      - name: Checkout target app (credit_card_recommend)
        if: ${{ !inputs.base_url }}
        uses: actions/checkout@v4
        with:
          repository: huangyj915/credit_card_recommend
          path: target-app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install isolated virtual environments
        run: |
          if [ -f target-app/requirements.txt ]; then
            python -m venv .venv-app
            .venv-app/bin/pip install --upgrade pip
            .venv-app/bin/pip install -r target-app/requirements.txt
          fi
          python -m venv .venv-test
          .venv-test/bin/pip install --upgrade pip
          .venv-test/bin/pip install -r test-suite/requirements.txt
          .venv-test/bin/playwright install chromium --with-deps

      - name: Restore previous CI history workbook from gh-pages (if present)
        continue-on-error: true
        run: |
          mkdir -p test-suite/reports
          git clone --depth 1 --branch gh-pages "https://github.com/${{ github.repository }}.git" gh-pages-prev 2>/dev/null || true
          if [ -f gh-pages-prev/test-history-summary.xlsx ]; then
            cp gh-pages-prev/test-history-summary.xlsx test-suite/reports/test-history-summary.xlsx
          fi
          rm -rf gh-pages-prev

      - name: Start local target app server (uvicorn)
        if: ${{ !inputs.base_url }}
        working-directory: target-app
        run: |
          mkdir -p data
          nohup ../.venv-app/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo "UVICORN_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/config > /dev/null; then
              echo "Target server is ready on http://127.0.0.1:8000"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/uvicorn.log
          exit 1

      - name: Run automated test suite
        working-directory: test-suite
        env:
          BASE_URL: ${{ inputs.base_url || 'http://127.0.0.1:8000' }}
          REQUIRE_EN_I18N: ${{ inputs.require_en || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_FULL_SUITE: ${{ inputs.run_full_suite || 'false' }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            ../.venv-test/bin/pytest -m official_sync --junitxml=reports/junit.xml
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$RUN_FULL_SUITE" = "true" ]; then
            ../.venv-test/bin/pytest --junitxml=reports/junit.xml
          else
            ../.venv-test/bin/pytest -m "not responsive and not data_quality and not pending_app_push and not official_sync" --junitxml=reports/junit.xml
          fi

      - name: Stop local target app server
        if: always() && env.UVICORN_PID != ''
        run: kill "$UVICORN_PID" || true

      - name: Publish Markdown summary to GitHub Actions Step Summary
        if: always()
        run: |
          if [ -f test-suite/reports/latest.md ]; then
            cat test-suite/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test reports & failure evidence (Excel, JUnit, Trace, Screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            test-suite/reports/latest.xlsx
            test-suite/reports/latest.md
            test-suite/reports/index.html
            test-suite/reports/junit.xml
            test-suite/reports/test-history-summary.xlsx
            test-suite/reports/artifacts/**
          retention-days: 30

  deploy-pages:
    needs: pytest-playwright
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download latest report artifact
        uses: actions/download-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: pages-dist

      - name: Publish HTML & Excel dashboard to GitHub Pages (gh-pages)
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-dist
          exclude_assets: "junit.xml,artifacts/**"
